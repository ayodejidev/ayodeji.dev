[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.19.0"
  # The Netlify UI still has the Next.js runtime from the previous site.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/about"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/blog/tags/*"
  to = "/topics/:splat"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
